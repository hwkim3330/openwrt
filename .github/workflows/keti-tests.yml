# Runs the KETI sensor-bridge test suites on every push that touches them.
#
# These are the suites that need no target hardware: the Ouster parser against
# synthesised packets, the AgileX decoder against hand-built frames, the motion
# command encoder against a running agx-cmd, the CAN bridge against vcan, the
# i-BUS decoder against a pty, the teleop safety properties, and the AFHDS 2A
# frame builders. Together
# they are what stands in for a lidar, a vehicle and an RC receiver that are not
# on the bench, so a regression in them is a regression nobody would otherwise
# notice until the hardware arrived.
#
# The OpenWrt image build is not here on purpose - it needs a toolchain build and
# upstream's own build-pr-profile workflow already covers the device profile.
name: KETI sensor bridge tests

on:
  push:
    paths:
      - 'package/keti/**'
      - '.github/workflows/keti-tests.yml'
  pull_request:
    paths:
      - 'package/keti/**'
  workflow_dispatch:

jobs:
  tests:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4

      # vcan is not in the runner's default kernel package. Try to get it; if
      # it cannot be had, the CAN suite is skipped rather than silently passing
      # or failing the whole run over an environment gap.
      - name: vcan for the CAN bridge tests
        id: vcan
        run: |
          if ! sudo modprobe vcan 2>/dev/null; then
            sudo apt-get update -qq
            sudo apt-get install -y -qq "linux-modules-extra-$(uname -r)" || true
            sudo modprobe vcan 2>/dev/null || true
          fi
          if sudo ip link add dev vcan0 type vcan 2>/dev/null; then
            sudo ip link set up vcan0
            ip -br link show type vcan
            echo "available=yes" >> "$GITHUB_OUTPUT"
          else
            echo "::warning::vcan unavailable on this runner; the CAN bridge suite is skipped"
            echo "available=no" >> "$GITHUB_OUTPUT"
          fi

      - name: ouster-edge
        working-directory: package/keti/ouster-edge/test
        run: |
          # -lm because the IMU tilt uses atan2 and sqrt. It is not needed for
          # the target build - musl keeps the maths in libc - so the package
          # compiled for MIPS while this job did not link, which is exactly the
          # gap a CI on a different libc exists to catch.
          cc -O2 -Wall -Wextra -Werror -o ouster-edge ../src/ouster-edge.c -lm
          OUSTER_EDGE_BIN=./ouster-edge python3 test_profiles.py
          OUSTER_EDGE_BIN=./ouster-edge python3 test_accounting.py
          OUSTER_EDGE_BIN=./ouster-edge python3 test_latency.py
          OUSTER_EDGE_BIN=./ouster-edge python3 test_zones.py
          sh test_metadata.sh

      # Always compiled, even when it cannot be run: a compile break is the
      # regression most likely to slip through otherwise. agilex.c has to be on
      # the command line - can-bridge.c calls agx_decode() and agx_variant(),
      # so compiling it alone fails at link, which is how this step spent its
      # whole life red instead of guarding anything.
      - name: can-bridge (compile)
        working-directory: package/keti/can-bridge/test
        run: |
          cc -O2 -Wall -Wextra -Werror -o can-bridge \
            ../src/can-bridge.c ../src/agilex.c

      # No vcan needed: this is pure decode against hand-built frames, so it is
      # the one CAN check that runs everywhere. It guards the two mistakes the
      # protocol invites - reading the big-endian payload little-endian, and
      # confusing 0x221 (motion state) with 0x251 (first actuator).
      - name: agilex protocol decode
        working-directory: package/keti/can-bridge/test
        run: |
          cc -O2 -Wall -Wextra -Werror -o test_agilex \
            test_agilex.c ../src/agilex.c
          ./test_agilex

      - name: can-bridge (run)
        if: steps.vcan.outputs.available == 'yes'
        working-directory: package/keti/can-bridge/test
        run: CAN_BRIDGE_BIN=./can-bridge python3 test_bridge.py

      # The only code here that can move a vehicle, so its safety properties are
      # asserted against a running daemon rather than reviewed: silence while
      # disarmed, full stick meaning the configured limit and not more, a step
      # input ramped, the deadman ending in a stop and then silence, and exit
      # putting a zero on the wire.
      - name: agx-cmd safety properties
        working-directory: package/keti/agx-cmd/test
        run: |
          cc -O2 -Wall -Wextra -Werror -I../../can-bridge/src -o agx-cmd \
            ../src/agx-cmd.c ../../can-bridge/src/agilex.c
          AGX_CMD_BIN=./agx-cmd python3 test_agx_cmd.py

      - name: rc-ibus
        working-directory: package/keti/rc-ibus/test
        run: |
          cc -O2 -Wall -Wextra -Werror -o rc-ibus ../src/rc-ibus.c
          RC_IBUS_BIN=./rc-ibus python3 test_ibus.py

      - name: teleop
        working-directory: package/keti/teleop/test
        run: |
          cc -O2 -Wall -Wextra -Werror -o teleop ../src/teleop.c
          TELEOP_BIN=./teleop python3 test_teleop.py

      - name: afhds2a frame builders
        working-directory: package/keti/rc-tx/test
        run: |
          cc -O2 -Wall -Wextra -Werror -o test_afhds2a test_afhds2a.c ../src/afhds2a.c
          ./test_afhds2a

      - name: shell syntax of everything shipped
        run: |
          fail=0
          for f in $(find package/keti -type f \( -name '*.init' -o -name 'can-up' \
                     -o -name '*.hotplug' -o -name 'flash-router' \
                     -o -name 'sensor-probe' -o -name 'sensor-lan-tune' \
                     -o -name 'ouster-metadata' -o -name 'first-boot-report' \
                     -o -name '99-a3004-sensorkit' \)); do
            sh -n "$f" || { echo "FAIL $f"; fail=1; }
          done
          exit $fail
