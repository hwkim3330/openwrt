# Runs the KETI sensor-bridge test suites on every push that touches them.
#
# These are the suites that need no target hardware: the Ouster parser against
# synthesised packets, the CAN bridge against vcan, the i-BUS decoder against a
# pty, the teleop safety properties, and the AFHDS 2A frame builders. Together
# they are what stands in for a lidar, a vehicle and an RC receiver that are not
# on the bench, so a regression in them is a regression nobody would otherwise
# notice until the hardware arrived.
#
# The OpenWrt image build is not here on purpose - it needs a toolchain build and
# upstream's own build-pr-profile workflow already covers the device profile.
name: KETI sensor bridge tests

on:
  push:
    paths:
      - 'package/keti/**'
      - '.github/workflows/keti-tests.yml'
  pull_request:
    paths:
      - 'package/keti/**'
  workflow_dispatch:

jobs:
  tests:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4

      - name: vcan for the CAN bridge tests
        run: |
          sudo modprobe vcan
          sudo ip link add dev vcan0 type vcan
          sudo ip link set up vcan0
          ip -br link show type vcan

      - name: ouster-edge
        working-directory: package/keti/ouster-edge/test
        run: |
          cc -O2 -Wall -Wextra -Werror -o ouster-edge ../src/ouster-edge.c
          OUSTER_EDGE_BIN=./ouster-edge python3 test_profiles.py
          OUSTER_EDGE_BIN=./ouster-edge python3 test_accounting.py
          OUSTER_EDGE_BIN=./ouster-edge python3 test_latency.py
          OUSTER_EDGE_BIN=./ouster-edge python3 test_zones.py
          sh test_metadata.sh

      - name: can-bridge
        working-directory: package/keti/can-bridge/test
        run: |
          cc -O2 -Wall -Wextra -Werror -o can-bridge ../src/can-bridge.c
          CAN_BRIDGE_BIN=./can-bridge python3 test_bridge.py

      - name: rc-ibus
        working-directory: package/keti/rc-ibus/test
        run: |
          cc -O2 -Wall -Wextra -Werror -o rc-ibus ../src/rc-ibus.c
          RC_IBUS_BIN=./rc-ibus python3 test_ibus.py

      - name: teleop
        working-directory: package/keti/teleop/test
        run: |
          cc -O2 -Wall -Wextra -Werror -o teleop ../src/teleop.c
          TELEOP_BIN=./teleop python3 test_teleop.py

      - name: afhds2a frame builders
        working-directory: package/keti/rc-tx/test
        run: |
          cc -O2 -Wall -Wextra -Werror -o test_afhds2a test_afhds2a.c ../src/afhds2a.c
          ./test_afhds2a

      - name: shell syntax of everything shipped
        run: |
          fail=0
          for f in $(find package/keti -type f \( -name '*.init' -o -name 'can-up' \
                     -o -name 'sensor-probe' -o -name 'sensor-lan-tune' \
                     -o -name 'ouster-metadata' -o -name 'first-boot-report' \
                     -o -name '99-a3004-sensorkit' \)); do
            sh -n "$f" || { echo "FAIL $f"; fail=1; }
          done
          exit $fail
